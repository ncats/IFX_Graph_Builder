#destination_credentials: &destination_credentials ./src/use_cases/secrets/local_arangodb.yaml
#object_storage_credentials: &object_storage_credentials ./src/use_cases/secrets/local_s3.yaml

destination_credentials: &destination_credentials ./src/use_cases/secrets/ifxdev_arangodb.yaml
object_storage_credentials: &object_storage_credentials ./src/use_cases/secrets/aws_ifx_registry.yaml
ramp_release: &ramp_release ramp:sqlite_database:3.0.12-ramp4.0

registry:
  credentials: *object_storage_credentials

resolvers:
  - label: ramp_resolver
    import: ./src/id_resolvers/ramp_metabolite_resolver.py
    class: RampMetaboliteIdResolver
    kwargs:
      types:
        - Metabolite
      data_source: *ramp_release

  - label: ensembl_resolver
    import: ./src/id_resolvers/ensembl_gene_resolver.py
    class: EnsemblGeneResolver
    kwargs:
      data_source: ensembl:human_ftp:116
      types:
        - Gene

input_adapters:
  - import: ./src/input_adapters/pounce_sheets/pounce_input_adapter.py
    class: PounceInputAdapter
    kwargs:
      project_file: ./input_files/manual/pounce/templates/POUNCE_Project_Metabo_Template_v2.xlsx
      experiment_files:
        - ./input_files/manual/pounce/templates/POUNCE_Experiment_Metabo_Template_v2.xlsx
      stats_results_files:
        - ./input_files/manual/pounce/templates/POUNCE_StatsResults_Metabo_Template_v2.xlsx
      validators_config: ./src/use_cases/pounce/pounce_validators.yaml

  - import: ./src/input_adapters/pounce_sheets/pounce_input_adapter.py
    class: PounceInputAdapter
    kwargs:
      project_file: ./input_files/manual/pounce/templates/POUNCE_Project_Transcriptomics_Template_v2.xlsx
      experiment_files:
        - ./input_files/manual/pounce/templates/POUNCE_Experiment_Transcriptomics_Template_v2.xlsx
      stats_results_files:
        - ./input_files/manual/pounce/templates/POUNCE_StatsResults_Transcriptomics_Template_v2.xlsx
      validators_config: ./src/use_cases/pounce/pounce_validators.yaml

  - import: ./src/input_adapters/pounce_sheets/pounce_input_adapter.py
    class: PounceInputAdapter
    kwargs:
      project_file: ./input_files/manual/pounce/templates/POUNCE_Project_Proteomics_Template_v2.xlsx
      experiment_files:
        - ./input_files/manual/pounce/templates/POUNCE_Experiment_Proteomics_Template_v2.xlsx
      stats_results_files:
        - ./input_files/manual/pounce/templates/POUNCE_StatsResults_Proteomics_Template_v2.xlsx
      validators_config: ./src/use_cases/pounce/pounce_validators.yaml


output_adapters:
  - import: ./src/output_adapters/arango_output_adapter.py
    class: ArangoOutputAdapter
    kwargs:
      database_name: pounce
      object_storage_credentials: *object_storage_credentials
    credentials: *destination_credentials
