source_credentials: &source_credentials ./src/use_cases/secrets/ifxdev_arangodb.yaml
database_name: &database_name metabolite_harmonization
object_storage_credentials: &object_storage_credentials ./src/use_cases/secrets/aws_ifx_registry.yaml

registry:
  credentials: *object_storage_credentials

input_adapters:
  - import: ./src/input_adapters/metabolite_harmonization/hmdb.py
    class: HmdbMetaboliteEquivalenceAdapter
    kwargs:
      data_source: hmdb:metabolites_xml:5.0

  - import: ./src/input_adapters/metabolite_harmonization/hmdb_classes_ontology.py
    class: HmdbMetaboliteClassificationAdapter
    kwargs:
      data_source: hmdb:metabolites_xml:5.0

  - import: ./src/input_adapters/metabolite_harmonization/hmdb_classes_ontology.py
    class: HmdbOntologyAdapter
    kwargs:
      data_source: hmdb:metabolites_xml:5.0

  - import: ./src/input_adapters/metabolite_harmonization/hmdb_pathways.py
    class: HmdbMetabolitePathwayContextAdapter
    kwargs:
      data_source: hmdb:metabolites_xml:5.0

  - import: ./src/input_adapters/metabolite_harmonization/hmdb_proteins.py
    class: HmdbProteinContextAdapter
    kwargs:
      data_source: hmdb:proteins_xml:5.0

  - import: ./src/input_adapters/metabolite_harmonization/reactome_pathways.py
    class: ReactomePathwayContextAdapter
    kwargs:
      data_source: reactome:pathways:97

  - import: ./src/input_adapters/metabolite_harmonization/wikipathways.py
    class: WikiPathwaysMetaboliteEquivalenceAdapter
    kwargs:
      data_source: wikipathways:rdf_wp:2026-09-10

  - import: ./src/input_adapters/metabolite_harmonization/wikipathways.py
    class: WikiPathwaysPathwayContextAdapter
    kwargs:
      data_source: wikipathways:rdf_wp:2026-09-10

  - import: ./src/input_adapters/metabolite_harmonization/pfocr_pathways.py
    class: PfocrPathwayContextAdapter
    kwargs:
      data_source: pfocr:human_pathways:2025-07-01

  - import: ./src/input_adapters/metabolite_harmonization/expasy.py
    class: ExpasyEnzymeClassAdapter
    kwargs:
      data_source: expasy:enzyme:2026-09-02

  - import: ./src/input_adapters/metabolite_harmonization/rhea.py
    class: RheaReactionAdapter
    kwargs:
      data_source: rhea:reaction_bundle:142
      uniprot_data_source: uniprot:human:2026_03

  - import: ./src/input_adapters/metabolite_harmonization/lipidmaps.py
    class: LipidMapsMetaboliteEquivalenceAdapter
    kwargs:
      data_source: lipidmaps:lmsd_sdf:2026-09-18

  - import: ./src/input_adapters/metabolite_harmonization/lipidmaps_classes.py
    class: LipidMapsMetaboliteClassificationAdapter
    kwargs:
      data_source: lipidmaps:lmsd_sdf:2026-09-18

  - import: ./src/input_adapters/metabolite_harmonization/refmet.py
    class: RefMetMetaboliteEquivalenceAdapter
    kwargs:
      data_source: refmet:metabolites_csv:sha256-ef152c85ded4

  - import: ./src/input_adapters/metabolite_harmonization/chemprops.py
    class: HmdbMetaboliteChemPropsAdapter
    kwargs:
      data_source: hmdb:structures_sdf:5.0
      metabolites_data_source: hmdb:metabolites_xml:5.0

  - import: ./src/input_adapters/metabolite_harmonization/chemprops.py
    class: ChebiMetaboliteChemPropsAdapter
    kwargs:
      data_source: chebi:three_star_sdf:2026-09-09

  - import: ./src/input_adapters/metabolite_harmonization/chemprops.py
    class: LipidMapsMetaboliteChemPropsAdapter
    kwargs:
      data_source: lipidmaps:lmsd_sdf:2026-09-18

  - import: ./src/input_adapters/metabolite_harmonization/chemprops.py
    class: PubchemMetaboliteChemPropsAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: pubchem:cid_molecular_info:deps-74c850f19f6c}

  - import: ./src/input_adapters/chebi/chebi_obo_adapter.py
    class: ChebiFullOboAdapter
    kwargs:
      data_source: chebi:ontology_full:255

  - import: ./src/input_adapters/metabolite_harmonization/chebi_bridge.py
    class: ChebiMetaboliteIdentifierBridgeAdapter
    kwargs:
      data_source: chebi:ontology_full:255

post_adapters:
  - import: ./src/input_adapters/metabolite_harmonization/generic_structure.py
    class: MetaboliteGenericStructureAdapter
    kwargs:
      database_name: *database_name
    credentials: *source_credentials

output_adapters:
  - import: ./src/output_adapters/arango_output_adapter.py
    class: ArangoOutputAdapter
    kwargs:
      database_name: *database_name
    credentials: *source_credentials
