source_credentials: &source_credentials ./src/use_cases/secrets/local_arangodb.yaml
database_name: &database_name impatient_target_graph
pchembl_cutoff: &pchembl_cutoff 5

registry:
  cache_dir: ./registry_cache

resolvers:
  - label: tg_genes
    import: ./src/id_resolvers/target_graph_resolver.py
    class: TargetGraphGeneResolver
    kwargs:
      resolver_snapshot: target_graph:tg_genes:deps-8586c2184953
      types:
        - Gene
      no_match_behavior: Skip

  - label: tg_transcripts
    import: ./src/id_resolvers/target_graph_resolver.py
    class: TargetGraphTranscriptResolver
    kwargs:
      resolver_snapshot: target_graph:tg_transcripts:deps-05759c18b002
      types:
        - Transcript
      no_match_behavior: Skip

  - label: tg_proteins
    import: ./src/id_resolvers/target_graph_resolver.py
    class: TargetGraphProteinResolver
    kwargs:
      resolver_snapshot: target_graph:tg_proteins:deps-5d66e3c0a573
      types:
        - Protein
      no_match_behavior: Skip

input_adapters:
  - import: ./src/input_adapters/go/go_term.py
    class: GOTermAdapter
    kwargs:
      data_source: go:ontology:2026-08-08

  - import: ./src/input_adapters/target_graph/protein_nodes_and_edges.py
    class: ProteinNodeAdapter
    kwargs:
      data_source: target_graph:protein_ids:2026-09-05

  - import: ./src/input_adapters/target_graph/protein_nodes_and_edges.py
    class: IsoformProteinEdgeAdapter
    kwargs:
      data_source: target_graph:protein_ids:2026-09-05

  - import: ./src/input_adapters/target_graph/gene_node.py
    class: GeneNodeAdapter
    kwargs:
      data_source: target_graph:gene_ids:2026-09-05

  - import: ./src/input_adapters/target_graph/transcript_node.py
    class: TranscriptNodeAdapter
    kwargs:
      data_source: target_graph:transcript_ids:2026-09-05

  - import: ./src/input_adapters/target_graph/gene_transcript_edge.py
    class: GeneTranscriptEdgeAdapter
    kwargs:
      data_source: target_graph:transcript_ids:2026-09-05

  - import: ./src/input_adapters/target_graph/protein_nodes_and_edges.py
    class: TranscriptProteinEdgeAdapter
    kwargs:
      data_source: target_graph:protein_ids:2026-09-05

  - import: ./src/input_adapters/target_graph/protein_nodes_and_edges.py
    class: GeneProteinEdgeAdapter
    kwargs:
      data_source: target_graph:protein_ids:2026-09-05

  - import: ./src/input_adapters/drug_harmonizer/drug_nodes_and_edges.py
    class: DrugHarmonizerLigandNodeAdapter
    kwargs:
      data_source: drug_graph:drug_nodes:2026-09-05

  - import: ./src/input_adapters/drug_harmonizer/drug_nodes_and_edges.py
    class: DrugHarmonizerProteinLigandEdgeAdapter
    kwargs:
      data_source: drug_graph:drug_edges:2026-09-05
      pchembl_cutoff: *pchembl_cutoff

  - import: ./src/input_adapters/jensenlab/total_pmscore.py
    class: TotalPMScoreAdapter
    kwargs:
      data_source: jensenlab:protein_counts:2026-08-23

  - import: ./src/input_adapters/antibodypedia/antibody_count.py
    class: AntibodyCountAdapter
    kwargs:
      data_source: antibodypedia:scraped_results:2026-09-07_10-39

  - import: ./src/input_adapters/manual/idg_family.py
    class: ManualIDGFamilyAdapter
    kwargs:
      data_source: target_graph:tdl_updates:2026-09-05

  - import: ./src/input_adapters/go/go_gaf.py
    class: ProteinGoTermEdgeAdapter
    kwargs:
      data_source: go:goa_human_uniprot:2026-10-11
      source: UniProt

  - import: ./src/input_adapters/go/go_gaf.py
    class: ProteinGoTermEdgeAdapter
    kwargs:
      data_source: go:goa_human_go:2026-05-28
      source: GO

  - import: ./src/input_adapters/target_graph/generif_publications.py
    class: TargetGraphGeneRifPublicationAdapter
    kwargs:
      data_source: target_graph:generif:2026-09-05

output_adapters:
  - import: ./src/output_adapters/arango_output_adapter.py
    class: ArangoOutputAdapter
    kwargs:
      database_name: *database_name
    credentials: *source_credentials
