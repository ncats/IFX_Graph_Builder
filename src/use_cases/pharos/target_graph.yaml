source_credentials: &source_credentials ./src/use_cases/secrets/ifxdev_arangodb.yaml
legacy_pharos_credentials: &legacy_pharos_credentials ./src/use_cases/secrets/pharos_credentials.yaml
database_name: &database_name target_graph
pchembl_cutoff: &pchembl_cutoff 5

registry:
  credentials: ./src/use_cases/secrets/aws_ifx_registry.yaml

resolvers:
  - label: translator_nn
    import: ./src/id_resolvers/node_normalizer.py
    class: TranslatorNodeNormResolver
    kwargs:
      types:
        - Ligand
        - Disease

  - label: tg_genes
    import: ./src/id_resolvers/target_graph_resolver.py
    class: TargetGraphGeneResolver
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}
      types:
        - Gene
      no_match_behavior: Skip

  - label: tg_transcripts
    import: ./src/id_resolvers/target_graph_resolver.py
    class: TargetGraphTranscriptResolver
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}
      types:
        - Transcript
      no_match_behavior: Skip

  - label: tg_proteins
    import: ./src/id_resolvers/target_graph_resolver.py
    class: TargetGraphProteinResolver
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}
      types:
        - Protein
      no_match_behavior: Skip

  - label: hcop_ortholog_genes
    import: ./src/id_resolvers/hcop_ortholog_gene_resolver.py
    class: HCOPOrthologGeneResolver
    kwargs:
      data_source: hcop:human_all_sixteen_column:2026-10-01
      accepted_species: ["9598", "9544", "10090", "10116", "9615", "9796", "9913", "9823", "13616", "9258", "9031", "28377", "8364", "7955", "6239", "7227", "4932"]
      drop_blank_ortholog_identity: true
      types:
        - OrthologGene

  - label: tissue_ids
    import: ./src/id_resolvers/tissue_resolver.py
    class: TissueResolver
    kwargs:
      data_source: uberon:ontology:2026-10-01
      valid_ontologies: ["FMA", "EMAPA", "MA", "UMLS", "NCIT", "ZFA", "BTO", "CLDB", "EHDAA2", "BAMS", "neuronames", "VHOG", "MESH", "BIRNLEX", "TAO", "EHDAA", "GAID", "DHBA", "CALOHA", "EFO", "XAO", "HBA", "OpenCyc", "MBA", "galen", "FBbt", "GC_ID", "EV", "DMBA", "BM", "MAT", "MIAA", "NLXANAT", "VSAO", "AEO", "RETIRED_EHDAA2", "KUPO", "Wikipedia", "NLX", "ZFS", "UBERONTEMP", "UBERON", "TGMA", "TE", "TADS", "STID", "SPD", "SCTID", "SAO", "PHENOSCAPE", "PBA", "OGES", "OGEM", "NOID", "NIFSTD", "MURDOCH", "MPATH", "MP", "MFMO", "MAP", "ISBN", "HAO", "GOC", "GO", "FMAID", "FAO", "EVM", "ENVO", "EMAPS", "EHDA", "CP", "CL", "CARO", "BSA", "BILS", "BILA", "ANISEED", "ABA", "AAO"]
      types:
        - Tissue

input_adapters:
  - import: ./src/input_adapters/uberon_adapter.py
    class: UberonAdapter
    kwargs:
      data_source: uberon:ontology:2026-10-01

  # TODO: Evaluate GOTermAdapter consuming go.obo from the expanded go:ontology
  # bundle instead of go-basic.json, so Registry can eventually keep one format.
  # Compare term fields, obsolete-term handling, and is_a edges before migrating;
  # GO core has additional relationships. Keep the current pin until validated.
  - import: ./src/input_adapters/go/go_term.py
    class: GOTermAdapter
    kwargs:
      data_source: go:ontology:2026-07-26-bundle1

  - import: ./src/input_adapters/target_graph/protein_nodes_and_edges.py
    class: ProteinNodeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}

  - import: ./src/input_adapters/file_uniprot/protein_adapter.py
    class: ProteinAdapter
    kwargs:
      data_source: uniprot:human:2026_03
      file_name: uniprot-human.json.gz

  - import: ./src/input_adapters/target_graph/protein_nodes_and_edges.py
    class: IsoformProteinEdgeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}

  - import: ./src/input_adapters/target_graph/gene_node.py
    class: GeneNodeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}

  - import: ./src/input_adapters/target_graph/transcript_node.py
    class: TranscriptNodeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}

  - import: ./src/input_adapters/target_graph/gene_transcript_edge.py
    class: GeneTranscriptEdgeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}

  - import: ./src/input_adapters/target_graph/protein_nodes_and_edges.py
    class: TranscriptProteinEdgeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}

  - import: ./src/input_adapters/target_graph/protein_nodes_and_edges.py
    class: GeneProteinEdgeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}

  - import: ./src/input_adapters/pharos_mysql/phipster_adapter.py
    class: PHIPSTERLegacyLiftAdapter
    kwargs:
      data_source: {kind: external_dataset_version, snapshot_id: legacy_pharos:pharos319_mysql:pharos319}
    credentials: *legacy_pharos_credentials

  - import: ./src/input_adapters/hcop/orthologs.py
    class: HCOPOrthologAdapter
    kwargs:
      data_source: hcop:human_all_sixteen_column:2026-10-01
      accepted_species:
        - "9598"
        - "9544"
        - "10090"
        - "10116"
        - "9615"
        - "9796"
        - "9913"
        - "9823"
        - "13616"
        - "9258"
        - "9031"
        - "28377"
        - "8364"
        - "7955"
        - "6239"
        - "7227"
        - "4932"
      drop_blank_ortholog_identity: true

  - import: ./src/input_adapters/mp/phenotype_terms.py
    class: MPPhenotypeAdapter
    kwargs:
      data_source: mp:ontology:2026-09-23

  - import: ./src/input_adapters/impc/phenotypes.py
    class: IMPCPhenotypeAdapter
    kwargs:
      data_source: impc:genotype_phenotype_assertions:2026-03-16

  - import: ./src/input_adapters/mgi/hmd_human_phenotype.py
    class: HMDHumanPhenotypeAdapter
    kwargs:
      data_source: mgi:hmd_human_phenotype:2026-10-05

  - import: ./src/input_adapters/string/string_ppi.py
    class: StringPPIAdapter
    kwargs:
      data_source: string:protein_links_human:12.5
      score_cutoff: 400

  - import: ./src/input_adapters/bioplex/bioplex_ppi.py
    class: BioPlexPPIAdapter
    kwargs:
      data_source: bioplex:ppi:3.0

  - import: ./src/input_adapters/reactome/reactome_ppi.py
    class: ReactomePPIAdapter
    kwargs:
      data_source: reactome:pathways:97-bundle1

  - import: ./src/input_adapters/gtex/gtex_expression.py
    class: GTExExpressionAdapter
    kwargs:
      data_source: gtex:expression_v11:v11

  - import: ./src/input_adapters/hpm/hpm_expression.py
    class: HPMExpressionAdapter
    kwargs:
      data_source: hpm:protein_expression:2014-05-29
      uberon_map_file_path: ./src/input_adapters/shared/manual_uberon_map.tsv

  - import: ./src/input_adapters/hpa/hpa_expression.py
    class: HPAProteinExpressionAdapter
    kwargs:
      data_source: hpa:tissue_expression:25.1
      uberon_map_file_path: ./src/input_adapters/shared/manual_uberon_map.tsv

  - import: ./src/input_adapters/hpa/hpa_expression.py
    class: HPARnaExpressionAdapter
    kwargs:
      data_source: hpa:tissue_expression:25.1
      uberon_map_file_path: ./src/input_adapters/shared/manual_uberon_map.tsv

  # DrugCentral release 56, export schema 1; all three adapters share this snapshot.
  - import: ./src/input_adapters/drug_central/drug_node.py
    class: DrugNodeAdapter
    kwargs:
      data_source: {kind: source_snapshot, snapshot_id: drugcentral:drug_exports:56-export1}

  - import: ./src/input_adapters/drug_central/protein_drug_edge.py
    class: ProteinDrugEdgeAdapter
    kwargs:
      data_source: {kind: source_snapshot, snapshot_id: drugcentral:drug_exports:56-export1}

  - import: ./src/input_adapters/iuphar/ligand_node.py
    class: LigandNodeAdapter
    kwargs:
      data_source: iuphar:ligands_interactions:2026-09-16

  - import: ./src/input_adapters/iuphar/protein_ligand_edge.py
    class: ProteinLigandEdgeAdapter
    kwargs:
      pchembl_cutoff: *pchembl_cutoff
      data_source: iuphar:ligands_interactions:2026-09-16

  - import: ./src/input_adapters/chembl/drug_node.py
    class: DrugNodeAdapter
    kwargs:
      data_source: {kind: external_dataset_version, snapshot_id: chembl:activity_database:chembl37}
      pchembl_cutoff: *pchembl_cutoff
    credentials: ./src/use_cases/secrets/chembl_credentials.yaml

  - import: ./src/input_adapters/chembl/drug_node.py
    class: ProteinDrugEdgeAdapter
    kwargs:
      data_source: {kind: external_dataset_version, snapshot_id: chembl:activity_database:chembl37}
      pchembl_cutoff: *pchembl_cutoff
    credentials: ./src/use_cases/secrets/chembl_credentials.yaml

  - import: ./src/input_adapters/drug_central/drug_indication.py
    class: DrugCentralIndicationAdapter
    kwargs:
      data_source: {kind: source_snapshot, snapshot_id: drugcentral:drug_exports:56-export1}

  - import: ./src/input_adapters/jensenlab/total_pmscore.py
    class: TotalPMScoreAdapter
    kwargs:
      data_source: jensenlab:protein_counts:2026-10-04

  - import: ./src/input_adapters/pubtator/publication_statistics.py
    class: PubTatorPublicationStatisticsAdapter
    kwargs:
      data_source: pubtator:gene2pubtator3:2026-10-06
    credentials: ./src/use_cases/secrets/ifx_pubmed_credentials.yaml

  - import: ./src/input_adapters/jensenlab/tissues_expression.py
    class: JensenLabTissuesExpressionAdapter
    kwargs:
      data_source: jensenlab:tissues:2026-10-05
      obo_data_source: uberon:ontology:2026-10-01

  - import: ./src/input_adapters/antibodypedia/antibody_count.py
    class: AntibodyCountAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: antibodypedia:scraped_results:2026-10-09_21-18-ifxprotein-2.4.0}
      identifier_mode: ifx_protein

  - import: ./src/input_adapters/pharos_mysql/idg_family_adapter.py
    class: IDGFamilyAdapter
    kwargs:
      data_source: {kind: external_dataset_version, snapshot_id: legacy_pharos:pharos319_mysql:pharos319}
    credentials: *legacy_pharos_credentials

  - import: ./src/input_adapters/go/go_gaf.py
    class: ProteinGoTermEdgeAdapter
    kwargs:
      data_source: go:goa_human_uniprot:2026-07-28
      source: UniProt

  - import: ./src/input_adapters/go/go_gaf.py
    class: ProteinGoTermEdgeAdapter
    kwargs:
      data_source: go:goa_human_go:2026-05-28
      source: GO

  - import: ./src/input_adapters/mondo/mondo_adapter.py
    class: MondoDiseaseAdapter
    kwargs:
      data_source: mondo:ontology:2026-10-06

  - import: ./src/input_adapters/mondo/mondo_adapter.py
    class: MondoDiseaseParentEdgeAdapter
    kwargs:
      data_source: mondo:ontology:2026-10-06

  - import: ./src/input_adapters/disease_ontology/do_adapter.py
    class: DODiseaseAdapter
    kwargs:
      data_source: disease_ontology:ontology:2026-09-30

  - import: ./src/input_adapters/disease_ontology/do_adapter.py
    class: DODiseaseParentEdgeAdapter
    kwargs:
      data_source: disease_ontology:ontology:2026-09-30

  - import: ./src/input_adapters/rdas/diseases.py
    class: RDASRareDiseaseAdapter
    kwargs:
      data_source: {kind: external_dataset_version, snapshot_id: rdas:diseases_graphql:rdas-diseases-graphql}

  - import: ./src/input_adapters/jensenlab/diseases.py
    class: JensenLabDiseasesAdapter
    kwargs:
      data_source: jensenlab:diseases:2026-10-04
      textmining_min_zscore: 6.0

  - import: ./src/input_adapters/pharos_mysql/eram_disease_adapter.py
    class: ERAMDiseaseAdapter
    kwargs:
      data_source: {kind: external_dataset_version, snapshot_id: legacy_pharos:pharos319_mysql:pharos319}
    credentials: *legacy_pharos_credentials

  - import: ./src/input_adapters/file_uniprot/protein_adapter.py
    class: ProteinDiseaseEdgeAdapter
    kwargs:
      data_source: uniprot:human:2026_03
      file_name: uniprot-human.json.gz

  - import: ./src/input_adapters/ctd/ctd_gene_disease.py
    class: CTDGeneDiseaseAdapter
    kwargs:
      data_source: ctd:curated_genes_diseases:2026-09-29

  - import: ./src/input_adapters/jensenlab/tinx.py
    class: TINXAdapter
    kwargs:
      data_source: jensenlab:tinx:2026-10-04

  - import: ./src/input_adapters/tiga/tiga.py
    class: TIGAAdapter
    kwargs:
      data_source: tiga:gene_trait:20260720

  - import: ./src/input_adapters/reactome/reactome_pathways.py
    class: ReactomePathwayAdapter
    kwargs:
      data_source: reactome:pathways:97-bundle1

  - import: ./src/input_adapters/reactome/reactome_pathways.py
    class: ReactomePathwayParentEdgeAdapter
    kwargs:
      data_source: reactome:pathways:97-bundle1

  - import: ./src/input_adapters/reactome/reactome_pathways.py
    class: ReactomeProteinPathwayEdgeAdapter
    kwargs:
      data_source: reactome:pathways:97-bundle1

  - import: ./src/input_adapters/wikipathways/wikipathways_pathways.py
    class: WikiPathwaysPathwayAdapter
    kwargs:
      data_source: wikipathways:human_gmt:2026-09-10

  - import: ./src/input_adapters/wikipathways/wikipathways_pathways.py
    class: WikiPathwaysGenePathwayEdgeAdapter
    kwargs:
      data_source: wikipathways:human_gmt:2026-09-10

  - import: ./src/input_adapters/pathwaycommons/pathwaycommons_pathways.py
    class: PathwayCommonsPathwayAdapter
    kwargs:
      data_source: pathwaycommons:pc_hgnc:14

  - import: ./src/input_adapters/pathwaycommons/pathwaycommons_pathways.py
    class: PathwayCommonsGenePathwayEdgeAdapter
    kwargs:
      data_source: pathwaycommons:pc_hgnc:14

  - import: ./src/input_adapters/panther/panther_classes.py
    class: PantherClassesAdapter
    kwargs:
      data_source: panther:protein_classes:19.0

  - import: ./src/input_adapters/pharos_mysql/dto_adapter.py
    class: DTOClassAdapter
    kwargs:
      data_source: {kind: external_dataset_version, snapshot_id: legacy_pharos:pharos319_mysql:pharos319}
    credentials: *legacy_pharos_credentials

  - import: ./src/input_adapters/pharos_mysql/dto_adapter.py
    class: DTOClassParentEdgeAdapter
    kwargs:
      data_source: {kind: external_dataset_version, snapshot_id: legacy_pharos:pharos319_mysql:pharos319}
    credentials: *legacy_pharos_credentials

  - import: ./src/input_adapters/pharos_mysql/dto_adapter.py
    class: ProteinDTOClassAdapter
    kwargs:
      data_source: {kind: external_dataset_version, snapshot_id: legacy_pharos:pharos319_mysql:pharos319}
    credentials: *legacy_pharos_credentials

  - import: ./src/input_adapters/surechembl/patent_families.py
    class: SureChEMBLPatentFamilyAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: surechembl:patent_family_mentions:deps-55ef832e4606}

  - import: ./src/input_adapters/ncbi/publications.py
    class: NCBIPublicationAdapter
    kwargs:
      data_source: ncbi:publications:2026-10-05

  - import: ./src/input_adapters/ncbi/gene_summary.py
    class: NCBIGeneSummaryAdapter
    kwargs:
      data_source: ncbi:gene_summary:2026-10-05

  - import: ./src/input_adapters/jensenlab/publications.py
    class: JensenLabPublicationAdapter
    kwargs:
      data_source: jensenlab:tinx:2026-10-04

output_adapters:
  - import: ./src/output_adapters/arango_output_adapter.py
    class: ArangoOutputAdapter
    kwargs:
      database_name: *database_name
    credentials: *source_credentials
