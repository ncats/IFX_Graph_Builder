source_credentials: &source_credentials ./src/use_cases/secrets/ifxdev_arangodb.yaml
legacy_pharos_credentials: &legacy_pharos_credentials ./src/use_cases/secrets/pharos_credentials.yaml
database_name: &database_name impatient_pharos
targets_release: &targets_release {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.5.2}
pchembl_cutoff: &pchembl_cutoff 5

registry:
  credentials: ./src/use_cases/secrets/aws_ifx_registry.yaml

resolvers:
  - label: translator_nn
    import: ./src/id_resolvers/node_normalizer.py
    class: TranslatorNodeNormResolver
    kwargs:
      types:
        - Ligand

  - label: tcrd_targets
    import: ./src/id_resolvers/target_consumer_pharos_resolver.py
    class: TargetConsumerPharosCanonicalResolver
    kwargs:
      data_source: *targets_release
      types:
        - Protein
        - Gene
        - Transcript
      no_match_behavior: Skip
      multi_match_behavior: All

input_adapters:
  - import: ./src/input_adapters/go/go_term.py
    class: GOTermAdapter
    kwargs:
      data_source: go:ontology:2026-07-26-bundle1

  - import: ./src/input_adapters/target_graph/protein_nodes_and_edges.py
    class: ProteinNodeAdapter
    kwargs:
      data_source: *targets_release
      canonical_only: true

  - import: ./src/input_adapters/drug_central/drug_node.py
    class: DrugNodeAdapter
    kwargs:
      data_source: {kind: source_snapshot, snapshot_id: drugcentral:drug_exports:56-export1}

  - import: ./src/input_adapters/drug_central/protein_drug_edge.py
    class: ProteinDrugEdgeAdapter
    kwargs:
      data_source: {kind: source_snapshot, snapshot_id: drugcentral:drug_exports:56-export1}

  - import: ./src/input_adapters/iuphar/ligand_node.py
    class: LigandNodeAdapter
    kwargs:
      data_source: iuphar:ligands_interactions:2026-10-20

  - import: ./src/input_adapters/iuphar/protein_ligand_edge.py
    class: ProteinLigandEdgeAdapter
    kwargs:
      pchembl_cutoff: *pchembl_cutoff
      data_source: iuphar:ligands_interactions:2026-10-20

  - import: ./src/input_adapters/chembl/drug_node.py
    class: DrugNodeAdapter
    kwargs:
      data_source: {kind: source_snapshot, snapshot_id: chembl:activity_exports:chembl37-export1}
      pchembl_cutoff: *pchembl_cutoff

  - import: ./src/input_adapters/chembl/drug_node.py
    class: ProteinDrugEdgeAdapter
    kwargs:
      data_source: {kind: source_snapshot, snapshot_id: chembl:activity_exports:chembl37-export1}
      pchembl_cutoff: *pchembl_cutoff

  - import: ./src/input_adapters/jensenlab/total_pmscore.py
    class: TotalPMScoreAdapter
    kwargs:
      data_source: jensenlab:protein_counts:2026-10-22

  - import: ./src/input_adapters/antibodypedia/antibody_count.py
    class: AntibodyCountAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: antibodypedia:scraped_results:2026-10-23_14-23-ifxprotein-2.5.2}
      identifier_mode: ifx_protein

  - import: ./src/input_adapters/go/go_gaf.py
    class: ProteinGoTermEdgeAdapter
    kwargs:
      data_source: go:goa_human_uniprot:2026-10-11
      source: UniProt

  - import: ./src/input_adapters/go/go_gaf.py
    class: ProteinGoTermEdgeAdapter
    kwargs:
      data_source: go:goa_human_go:2026-05-28
      source: GO

  - import: ./src/input_adapters/ncbi/publications.py
    class: NCBIPublicationAdapter
    kwargs:
      data_source: ncbi:publications:2026-10-23

  - import: ./src/input_adapters/pharos_mysql/idg_family_adapter.py
    class: IDGFamilyAdapter
    kwargs:
      data_source: {kind: external_dataset_version, snapshot_id: legacy_pharos:pharos319_mysql:pharos319}
    credentials: *legacy_pharos_credentials

post_adapters:

  - import: ./src/input_adapters/pharos_arango/set_preferred_symbol.py
    class: SetPreferredSymbolAdapter
    kwargs:
      database_name: *database_name
    credentials: *source_credentials

  - import: ./src/input_adapters/pharos_arango/set_ligand_activity_flag.py
    class: SetLigandActivityFlagAdapter
    kwargs:
      database_name: *database_name
    credentials: *source_credentials

  - import: ./src/input_adapters/pharos_arango/set_go_term_leaf_flag.py
    class: SetGoTermLeafFlagAdapter
    kwargs:
      database_name: *database_name
    credentials: *source_credentials

  - import: ./src/input_adapters/pharos_arango/tdl_input_adapter.py
    class: TDLInputAdapter
    kwargs:
      database_name: *database_name
      use_pharos_queries: True
    credentials: *source_credentials

  - import: ./src/input_adapters/manual/tdl_override.py
    class: TDLOverrideAdapter
    kwargs:
      data_source: target_graph:tdl_updates:2026-09-11

graph_views:
  - id: current_tdls
    label: Current TDLs
    description: Export current protein TDL assignments
    type: export
    output_format: csv
    query_language: aql
    columns:
      - id
      - uniprot_id
      - tdl
      - uniprot_reviewed
      - uniprot_annotationScore
      - name
      - xref
      - idg_family
      - uniprot_function
      - symbol
      - ncbi_id
      - ensembl_id
      - canonical_isoform_status
      - uniprot_isoform
      - tdl_ligand_count
      - tdl_drug_count
      - tdl_go_term_count
      - tdl_generif_count
      - tdl_pm_score
      - tdl_antibody_count
    query: |
      FOR pro IN `Protein`
        RETURN {
          id: pro.id,
          uniprot_id: pro.uniprot_id,
          tdl: pro.tdl,
          uniprot_reviewed: pro.uniprot_reviewed,
          uniprot_annotationScore: pro.uniprot_annotationScore,
          name: pro.name,
          xref: pro.xref,
          idg_family: pro.idg_family,
          uniprot_function: pro.uniprot_function,
          symbol: pro.symbol,
          ncbi_id: pro.ncbi_id,
          ensembl_id: pro.ensembl_id,
          canonical_isoform_status: pro.canonical_isoform_status,
          uniprot_isoform: pro.uniprot_isoform,
          tdl_ligand_count: pro.tdl_meta.tdl_ligand_count,
          tdl_drug_count: pro.tdl_meta.tdl_drug_count,
          tdl_go_term_count: pro.tdl_meta.tdl_go_term_count,
          tdl_generif_count: pro.tdl_meta.tdl_generif_count,
          tdl_pm_score: pro.tdl_meta.tdl_pm_score,
          tdl_antibody_count: pro.tdl_meta.tdl_antibody_count
        }

output_adapters:
  - import: ./src/output_adapters/arango_output_adapter.py
    class: ArangoOutputAdapter
    kwargs:
      database_name: *database_name
    credentials: *source_credentials
