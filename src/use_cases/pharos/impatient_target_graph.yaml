source_credentials: &source_credentials ./src/use_cases/secrets/ifxdev_arangodb.yaml
legacy_pharos_credentials: &legacy_pharos_credentials ./src/use_cases/secrets/pharos_credentials.yaml
database_name: &database_name impatient_target_graph
pchembl_cutoff: &pchembl_cutoff 5

registry:
  credentials: ./src/use_cases/secrets/aws_ifx_registry.yaml

resolvers:
  - label: tg_genes
    import: ./src/id_resolvers/target_graph_resolver.py
    class: TargetGraphGeneResolver
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}
      types:
        - Gene
      no_match_behavior: Skip

  - label: tg_transcripts
    import: ./src/id_resolvers/target_graph_resolver.py
    class: TargetGraphTranscriptResolver
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}
      types:
        - Transcript
      no_match_behavior: Skip

  - label: tg_proteins
    import: ./src/id_resolvers/target_graph_resolver.py
    class: TargetGraphProteinResolver
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}
      types:
        - Protein
      no_match_behavior: Skip

input_adapters:
  - import: ./src/input_adapters/go/go_term.py
    class: GOTermAdapter
    kwargs:
      data_source: go:ontology:2026-07-26-bundle1

  - import: ./src/input_adapters/target_graph/protein_nodes_and_edges.py
    class: ProteinNodeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}

  - import: ./src/input_adapters/target_graph/protein_nodes_and_edges.py
    class: IsoformProteinEdgeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}

  - import: ./src/input_adapters/target_graph/gene_node.py
    class: GeneNodeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}

  - import: ./src/input_adapters/target_graph/transcript_node.py
    class: TranscriptNodeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}

  - import: ./src/input_adapters/target_graph/gene_transcript_edge.py
    class: GeneTranscriptEdgeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}

  - import: ./src/input_adapters/target_graph/protein_nodes_and_edges.py
    class: TranscriptProteinEdgeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}

  - import: ./src/input_adapters/target_graph/protein_nodes_and_edges.py
    class: GeneProteinEdgeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: ifx_harmonizers:targets:2.4.0}

  - import: ./src/input_adapters/drug_harmonizer/drug_nodes_and_edges.py
    class: DrugHarmonizerLigandNodeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: drug_graph:drug_nodes:2026-09-04}

  - import: ./src/input_adapters/drug_harmonizer/drug_nodes_and_edges.py
    class: DrugHarmonizerProteinLigandEdgeAdapter
    kwargs:
      data_source: {kind: derived_snapshot, snapshot_id: drug_graph:drug_edges:2026-09-04}

  - import: ./src/input_adapters/jensenlab/total_pmscore.py
    class: TotalPMScoreAdapter
    kwargs:
      data_source: jensenlab:protein_counts:2026-10-04

  - import: ./src/input_adapters/antibodypedia/antibody_count.py
    class: AntibodyCountAdapter
    kwargs:
      data_source: antibodypedia:scraped_results:2025-06-27_12-32

  - import: ./src/input_adapters/pharos_mysql/idg_family_adapter.py
    class: IDGFamilyAdapter
    kwargs:
      data_source: {kind: external_dataset_version, snapshot_id: legacy_pharos:pharos319_mysql:pharos319}
    credentials: *legacy_pharos_credentials

  - import: ./src/input_adapters/go/go_gaf.py
    class: ProteinGoTermEdgeAdapter
    kwargs:
      data_source: go:goa_human_uniprot:2026-07-28
      source: UniProt

  - import: ./src/input_adapters/go/go_gaf.py
    class: ProteinGoTermEdgeAdapter
    kwargs:
      data_source: go:goa_human_go:2026-05-28
      source: GO

  - import: ./src/input_adapters/ncbi/publications.py
    class: NCBIPublicationAdapter
    kwargs:
      data_source: ncbi:publications:2026-10-05

output_adapters:
  - import: ./src/output_adapters/arango_output_adapter.py
    class: ArangoOutputAdapter
    kwargs:
      database_name: *database_name
    credentials: *source_credentials
